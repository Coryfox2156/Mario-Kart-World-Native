name: Compile iOS Native IPA
on:
  workflow_dispatch:

jobs:
  build-port:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          brew install xcodegen libarchive
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Download Game Assets from GoFile
        run: |
          curl -L -o game_dump.zip "${{ secrets.GAME_URL }}"
          mkdir -p game_assets
          unzip -q game_dump.zip -d game_assets/

      name: Run Native Recompilation Builder
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarioKartNativeIPA
          path: build/Mush8.ipa
